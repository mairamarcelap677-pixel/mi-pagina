<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
    <a href="paginaprincipal.html" class="back-button">← Regresar a la página principal</a>
    <div class="mover">
      <h1>REGISTRATE PARA MAS INFORMACION👇</h1>

     
    </div>
     
    <form action="#" method="post">
        <div class="grupo">
            <label>Nombre completo</label>
            <input type="text" placeholder="Ingresa tu nombre" required>

            <label>Correo electronico</label>
            <input type="email" placeholder="Ingresa tu correo electronico" required>

            <label>Edad</label>
            <input type="number" placeholder="Ingresa tu edad" required>

            <label>Telefono</label>
            <input type="tel" placeholder="Ingresa tu numero de telefono" required>

            <label>Ciudad</label>
            <input type="text" placeholder="Ingresa tu ciudad" required>
        </div>
   
        <button type="submit">Enviar Mensaje</button>
    </form>
</body>
</html>
